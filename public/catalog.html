<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOKAY LACE · 产品目录</title>
<link rel="icon" href="/public/logo.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --copper:#B66D44; --stroke:rgba(255,255,255,.7); --ink:#3b2b2e; --sub:#6d5a60; --muted:#8c7980;
    --glass:rgba(255,255,255,.55); --gshadow:0 10px 30px rgba(122,80,96,.14), inset 0 1px 0 rgba(255,255,255,.85); }
  body { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(60% 45% at 12% 6%, #E4C0A6 0%, rgba(228,192,166,0) 70%),
      radial-gradient(55% 50% at 52% 45%, #D488AC 0%, rgba(212,136,172,0) 72%),
      radial-gradient(70% 50% at 85% 100%, #EBD7CC 0%, rgba(235,215,204,0) 75%),
      linear-gradient(160deg, #f3ded0 0%, #e9c9cf 45%, #f0e0d8 100%);
    background-attachment: fixed; min-height: 100vh; padding-bottom: 86px; }
  .hero { position: relative; overflow: hidden; background: var(--glass); backdrop-filter: blur(22px) saturate(1.5);
    -webkit-backdrop-filter: blur(22px) saturate(1.5); border-bottom: 1px solid var(--stroke);
    box-shadow: var(--gshadow); padding: 40px 22px 30px; border-radius: 0 0 24px 24px; text-align: center; }
  .hero::before { content: ''; position: absolute; width: 340px; height: 340px; right: -120px; top: -160px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.75), rgba(255,255,255,0) 68%); pointer-events: none; }
  .hero .logo { height: 58px; width: auto; margin-bottom: 14px; }
  .brand-line { font-size: 10px; letter-spacing: .34em; color: var(--copper); margin-bottom: 10px; }
  .hero h1 { font-size: 24px; font-weight: 800; letter-spacing: .02em; }
  .hero .role { font-size: 12.5px; color: var(--sub); font-weight: 600; margin-top: 6px; letter-spacing: .08em; }
  .hero .rule { width: 40px; height: 1px; background: var(--copper); margin: 16px auto 0; }
  .section { margin: 26px 16px 0; }
  .section h2 { font-size: 15px; font-weight: 800; margin-bottom: 14px; letter-spacing: .04em; display: flex; align-items: center; gap: 10px; }
  .section h2 .cnt { font-size: 11px; font-weight: 600; color: var(--copper); letter-spacing: .1em; }
  .section h2::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,.7); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .prod { background: var(--glass); backdrop-filter: blur(18px); border: 1px solid var(--stroke); border-radius: 18px;
    box-shadow: var(--gshadow); overflow: hidden; }
  .prod img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; background: #edebe5; }
  .prod .info { padding: 12px 14px; }
  .prod .name { font-size: 14px; font-weight: 700; letter-spacing: .04em; }
  .prod .code { font-size: 11.5px; color: var(--copper); margin-top: 4px; letter-spacing: .08em; }
  .prod .desc { font-size: 12px; color: var(--sub); margin-top: 6px; line-height: 1.6; }
  .loading { color: var(--muted); text-align: center; padding: 60px 0; font-size: 14px; letter-spacing: .1em; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 34px 0; letter-spacing: .06em; }
  .contactbar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.75); backdrop-filter: blur(22px) saturate(1.5);
    -webkit-backdrop-filter: blur(22px) saturate(1.5); border-top: 1px solid var(--stroke); box-shadow: 0 -6px 24px rgba(122,80,96,.12);
    display: flex; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
  .contactbar a { flex: 1; text-align: center; text-decoration: none; font-size: 13px; font-weight: 700; padding: 12px 0;
    border-radius: 14px; letter-spacing: .04em; }
  .cb-wa { background: #1c1b19; color: #ddbc7d; }
  .cb-tel { background: var(--glass); color: var(--ink); border: 1px solid var(--stroke); }
  .cb-card { background: var(--glass); color: var(--copper); border: 1px solid var(--stroke); }
  .foot { text-align: center; color: var(--muted); font-size: 11px; letter-spacing: .28em; padding: 34px 0 10px; }
  .foot .rule2 { width: 36px; height: 1px; background: var(--copper); margin: 0 auto 14px; }
  .pdfbtn { position: fixed; right: 16px; bottom: calc(78px + env(safe-area-inset-bottom)); z-index: 50; border: 1px solid var(--stroke);
    background: rgba(255,255,255,.8); backdrop-filter: blur(14px); color: var(--ink); font-size: 12px; font-weight: 700;
    padding: 10px 16px; border-radius: 14px; cursor: pointer; letter-spacing: .06em; box-shadow: 0 6px 18px rgba(122,80,96,.18); }
  @media print {
    body { background: #fff !important; padding-bottom: 0; }
    .contactbar, .pdfbtn { display: none !important; }
    .prod { break-inside: avoid; page-break-inside: avoid; }
    .section { break-inside: auto; }
    .hero { border-radius: 0; box-shadow: none; }
  }
</style>
</head>
<body>
  <div class="hero">
    <img class="logo" src="/public/logo.png" alt="TOKAY">
    <div class="brand-line">PRODUCT CATALOGUE</div>
    <h1 id="hCompany">TOKAY LACE</h1>
    <div class="rule"></div>
    <div class="role" id="hSub">完整产品目录 · COMPLETE PRODUCT LINE</div>
  </div>

  <div id="content" class="loading">加载产品目录…</div>

  <div class="foot"><div class="rule2"></div>TOKAY LACE · SINCE 2005</div>

  <button class="pdfbtn" onclick="window.print()">⤓ 导出 PDF</button>

  <div class="contactbar">
    <a id="cbWa" class="cb-wa" target="_blank" style="display:none">WhatsApp</a>
    <a id="cbTel" class="cb-tel" style="display:none">电话联系</a>
    <a id="cbCard" class="cb-card" target="_blank" style="display:none">查看名片</a>
  </div>

<script>
  const id = (location.pathname.match(/^\/catalog\/([\w-]+)/) || [])[1];
  (async () => {
    if (!id) { document.getElementById('content').textContent = '目录链接无效'; return; }
    try {
      const res = await fetch('/api/card/' + id);
      const c = await res.json();
      if (c.error) throw new Error(c.error);
      const p = c.profile || {};
      document.getElementById('hCompany').textContent = p.company || 'TOKAY LACE';
      document.getElementById('hSub').textContent = (p.slogan ? p.slogan + ' · ' : '') + '完整产品目录';

      const bar = document.getElementById('contactbar') || document.querySelector('.contactbar');
      const wa = document.getElementById('cbWa'), tel = document.getElementById('cbTel'), card = document.getElementById('cbCard');
      if (p.whatsapp) { wa.href = 'https://wa.me/' + p.whatsapp.replace(/[^\d]/g, ''); wa.style.display = 'block'; }
      if (p.phone) { tel.href = 'tel:' + p.phone.replace(/\s/g, ''); tel.style.display = 'block'; }
      card.href = '/card/' + id; card.style.display = 'block';

      const prods = c.products || [];
      if (!prods.length) { document.getElementById('content').textContent = '产品目录整理中…'; return; }
      // 按 desc 分类分组（保持出现顺序）
      const groups = [];
      const map = {};
      prods.forEach((pr) => {
        const cat = (pr.desc || '').split('·')[0].trim() || '产品目录';
        if (!map[cat]) { map[cat] = []; groups.push(cat); }
        map[cat].push(pr);
      });
      document.getElementById('content').innerHTML = groups.map((cat) =>
        '<div class="section"><h2>' + cat + ' <span class="cnt">' + map[cat].length + ' ITEMS</span></h2>' +
        '<div class="grid">' + map[cat].map((pr) =>
          '<div class="prod">' +
          (pr.imagePath ? '<img loading="lazy" src="' + pr.imagePath + '" alt="' + (pr.name || '') + '">' : '') +
          '<div class="info"><div class="name">' + (pr.name || '') + '</div>' +
          (pr.code ? '<div class="code">' + pr.code + '</div>' : '') +
          (pr.desc ? '<div class="desc">' + pr.desc + '</div>' : '') +
          '</div></div>'
        ).join('') + '</div></div>'
      ).join('') + '<div class="foot" style="padding-top:10px"><div class="rule2"></div>TOKAY LACE · SINCE 2005</div>';
    } catch (e) {
      document.getElementById('content').textContent = '加载失败：' + e.message;
    }
  })();
</script>
</body>
</html>
